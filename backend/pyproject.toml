[project]
name = "cadence-backend"
version = "0.1.0"
description = "Cadence API: personal time tracker and life analytics"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pydantic[email]>=2.9",
  "pydantic-settings>=2.6",
  "argon2-cffi>=23.1",
  "pyjwt>=2.9",
  "structlog>=24.4",
  "python-multipart>=0.0.12",
  "httpx>=0.27",
  "tzdata>=2024.2",
  "anthropic>=0.40",
  "rapidfuzz>=3.9",
  "jinja2>=3.1",
]

[project.optional-dependencies]
observability = ["sentry-sdk[fastapi]>=2.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.7", "mypy>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008", "E501", "B904", "E741", "UP046", "ASYNC240"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
