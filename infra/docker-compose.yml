# Local development stack: Postgres 16 + API + SPA dev server. Run from this folder: docker compose up --build
services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: cadence, POSTGRES_HOST_AUTH_METHOD: trust, POSTGRES_DB: cadence_dev }
    ports: ["54329:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U cadence -d cadence_dev"], interval: 3s, retries: 20 }
  api:
    build: ../backend
    environment:
      DATABASE_URL: postgresql+asyncpg://cadence@db:5432/cadence_dev
      JWT_SECRET: local-development-secret-at-least-32-characters-long
      APP_BASE_URL: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173
    ports: ["8000:8000"]
    depends_on: { db: { condition: service_healthy } }
  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment: { VITE_API_PROXY: "http://api:8000" }
    ports: ["5173:5173"]
    volumes: ["../frontend:/app"]
    depends_on: [api]
volumes:
  pgdata:
