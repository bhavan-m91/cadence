name: frontend
on:
  push: { branches: [main], paths: ["frontend/**", "backend/openapi.json", ".github/workflows/ci-frontend.yml"] }
  pull_request: { paths: ["frontend/**", "backend/openapi.json", ".github/workflows/ci-frontend.yml"] }
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - name: Generated API types are current
        run: |
          npm run gen-api
          git diff --exit-code src/api/generated || (echo "Run make gen-api and commit the result" && exit 1)
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
